# ---------------------------------------------------------------------------
# pyproject.toml — myocard-egm-signal
#
# Generic signal-processing primitives for intracardiac EGM data: filters
# (band-pass), windowing math (sliding peak-to-peak), threshold strategies
# (healthy / quiet, plus the Protocols defining the interface), calibration
# (Calibration dataclass + CalibrationStrategy Protocol + R-wave anchoring),
# and Record-Protocol-driven extractors (extract_healthy_segments,
# extract_noise_segments).
#
# No internal dependencies. Pure numpy + scipy. Consumed by:
#   - iafdb-pipeline                (concrete IAFDBRecord satisfies the Protocol)
#   - synthetic-egm-pipeline         (mixer uses bandpass, noise side uses extractors)
#   - egm-features                   (may call bandpass before feature extraction)
#
# Convention recap:
#   GitHub repo  : egm-signal                     (bare)
#   PyPI dist    : myocard-egm-signal             (myocard- prefix)
#   Import name  : myocard_egm_signal             (underscore)
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myocard-egm-signal"
version = "0.3.0"
description = "Generic signal-processing primitives for intracardiac EGM data: filters, windowing, threshold strategies, calibration, and Record-Protocol-driven segment extractors."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Daniel Klein", email = "daniel.anthony.klein.88@gmail.com" },
]
keywords = [
  "cardiac",
  "electrophysiology",
  "signal-processing",
  "egm",
  "intracardiac",
  "filters",
  "calibration",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Runtime deps. Deliberately tiny — no internal sibling repos. Anyone
# who wants to bandpass an EGM in a notebook pays only for numpy + scipy.
dependencies = [
  "numpy>=1.26,<2.5",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # ruff and mypy pinned to exact versions matching the rest of the
  # myocard-labs stack so local dev, CI, and the pre-commit hook all
  # run the same binary and format/typecheck identically.
  "ruff==0.15.17",
  "mypy==2.1.0",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
]

[project.urls]
Homepage      = "https://github.com/myocard-labs/egm-signal"
Repository    = "https://github.com/myocard-labs/egm-signal"
Issues        = "https://github.com/myocard-labs/egm-signal/issues"
Organization  = "https://github.com/myocard-labs"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/myocard_egm_signal"]
# Ship py.typed so downstream consumers (and CI mypy) can type-check
# imports from this package without an ignore-missing-imports override.
artifacts = [
  "src/myocard_egm_signal/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["myocard_egm_signal"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["src/myocard_egm_signal"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

# scipy ships without complete inline stubs; ignore-missing silences
# the dance without losing strict checking on our own code.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
